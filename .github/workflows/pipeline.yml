name: Pipeline

# Weekly batch (docs/IMPLEMENTATION_PLAN.md §2). Signals aggregate monthly;
# the weekly cadence picks up late-arriving source data for the previous month.
# No providers are enabled at M0, so runs are no-ops until Wave 1 lands.
on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      period:
        description: "Observation month (YYYY-MM). Default: previous full month."
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run pipeline
        run: |
          if [ -n "${{ inputs.period }}" ]; then
            npm run pipeline -- --period "${{ inputs.period }}"
          else
            npm run pipeline
          fi
      # M0: results stay in the runner's local data/ directory and are kept
      # as a build artifact. Replaced by R2 sync once R2Storage is implemented.
      - uses: actions/upload-artifact@v4
        with:
          name: linkora-data
          path: data/
          if-no-files-found: ignore
          retention-days: 30
